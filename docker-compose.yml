services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casecapital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: casecapital
    volumes:
      - casecapital_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casecapital -d casecapital"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://casecapital:${POSTGRES_PASSWORD}@db:5432/casecapital
    ports:
      - "127.0.0.1:8765:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  casecapital_pgdata: